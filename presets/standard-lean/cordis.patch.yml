# Agent preset standard-lean: the shipped `standard` plugin list edited by
# deletion — three surfaces removed:
#
#   - plan mode:   the `planning` group (`plan-mode`, i.e. `exit_plan_mode`)
#   - workflow:    `workflow-ptc` (the `workflowEngine` provider) + `tool-workflow`
#   - goals:       `command-goal` (the `/goal` command) + `tool-goal`
#
# Everything else is copied verbatim from
# node_modules/@deepseek-ai/dsh-web-app/presets/standard.patch.yml of the
# installed DSH, with two preset-owned additions: the persona suffix lines
# and the lean-prompt-sections plugin row (prompt surgery, see below).
# After upgrading DSH, re-diff against that file and re-apply
# the deletions; rows resolve against whatever the deployment installs, and
# mount validation fails loud rather than degrading silently.
- insert:
    - id: preset-standard-lean
      name: '@deepseek-ai/dsh-agent-preset'
      config:
        id: standard-lean
        name: Standard Lean
        description: >-
          The standard coding preset without plan mode, the workflow engine,
          or goals.
        order: 5
        plugins:
          - id: persona
            name: '@deepseek-ai/dsh-persona'
            config:
              # The suffix also carries the two-line replacement for the
              # stripped ui:deliverable-file-references section: link file
              # mentions, embed images. The rest of that block is upstream
              # style policy a lean session drops.
              suffix: >-
                Your working directory is {{cwd}}. Link file mentions in
                prose to their paths as [name](path); embed images as
                ![description](path).
              prefix: You are a coding agent powered by the {{model}} model.
          - id: agent-instructions
            name: '@deepseek-ai/dsh-agent-instructions'
            config:
              maxBytes: 65536
          - id: tool-bash
            name: '@deepseek-ai/dsh-tool-bash'
            disabled: !!js process.platform === 'win32'
          - id: tool-pwsh
            name: '@deepseek-ai/dsh-tool-pwsh'
            disabled: !!js process.platform !== 'win32'
          - id: tool-fs
            name: '@deepseek-ai/dsh-tool-fs'
          - id: tool-fs-search
            name: '@deepseek-ai/dsh-tool-fs-search'
            config:
              sampleOverCapGlobResults: false
          - id: tool-jobs
            name: '@deepseek-ai/dsh-tool-jobs'
          - id: skill-filesystem
            name: '@deepseek-ai/dsh-skill-filesystem'
          - id: tool-skill
            name: '@deepseek-ai/dsh-tool-skill'
          # standard's `planning` group (`plan-mode`) is deliberately omitted.
          - id: compaction
            name: cordis:group
            group: true
            isolate:
              compaction: true
              toolResultPruner: true
            config:
              - id: compaction-basic
                name: '@deepseek-ai/dsh-compaction-basic'
              - id: command-compact
                name: '@deepseek-ai/dsh-command-compact'
              - id: tool-result-pruner
                name: '@deepseek-ai/dsh-compaction-tool-result-pruner'
                config:
                  thresholdChars: 8192
                  headChars: 4096
                  tailChars: 1024
          # standard's delegation group minus `workflow-ptc` and `tool-workflow`.
          # No row left publishes `workflowEngine`, so the group carries no
          # `isolate` realm; nothing remaining injects it (`tool-workflow` and
          # `tool-ralph` were the only consumers, and both are gone or disabled).
          - id: delegation
            name: cordis:group
            group: true
            config:
              - id: tool-subagent-control
                name: '@deepseek-ai/dsh-tool-subagent-control'
              - id: tool-subagent-list-agents
                name: '@deepseek-ai/dsh-tool-subagent-control/list-agents'
              - id: tool-subagent
                name: '@deepseek-ai/dsh-tool-subagent'
                config:
                  provider: spawn
                  toolName: subagent
                  modelSelectionSettings: true
                  backgroundMode: continuable
              - id: tool-subagent-fork
                name: '@deepseek-ai/dsh-tool-subagent'
                config:
                  provider: fork
                  toolName: subagent_fork
                  backgroundMode: continuable
              - id: tool-subagent-codex
                name: '@deepseek-ai/dsh-tool-subagent'
                disabled: true
                config:
                  provider: codex
                  toolName: subagent_codex
                  backgroundMode: one-shot
                  maxDepth: provider-managed
              - id: tool-subagent-claude-code
                name: '@deepseek-ai/dsh-tool-subagent'
                disabled: true
                config:
                  provider: claude-code
                  toolName: subagent_claude_code
                  backgroundMode: one-shot
                  maxDepth: provider-managed
              # Kept disabled exactly as in `standard`. Note it cannot simply be
              # enabled here: `tool-ralph` injects `workflowEngine`, whose
              # provider (`workflow-ptc`) this preset removes.
              - id: tool-ralph
                name: '@deepseek-ai/dsh-tool-ralph'
                disabled: true
                config:
                  subagentProvider: spawn
                  maxRounds: 64
          - id: tool-ask-user
            name: '@deepseek-ai/dsh-tool-ask-user'
          - id: tool-todo
            name: '@deepseek-ai/dsh-tool-todo'
            config:
              allowParallelInProgress: true
          - id: tool-web
            name: '@deepseek-ai/dsh-tool-web'
            config:
              fetch: true
              searchTimeoutMs: 60000
          - id: present
            name: '@deepseek-ai/dsh-tool-present'
          - id: tool-plugin-manager
            name: '@deepseek-ai/dsh-plugin-manager/tools'
            disabled: true
          # Preset-local prompt surgery, not a tool: drops the deployment
          # sections a lean coding session does not need (harness source
          # root, web GUI surface, deliverable link-formatting policy) and
          # rewrites tool:edit down to its only rule the tool schema does
          # not carry. Resolves relative to this bundle. See
          # plugins/lean-prompt-sections.mjs and the watch list in README.md.
          - id: lean-prompt-sections
            name: './plugins/lean-prompt-sections.mjs'
